[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-rr-engine"
version = "0.1.0"
description = "BTC Options Risk-Reward Engine for Delta Exchange — decision support, not financial advice"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ta>=0.11",
    "ruff>=0.4",
    "jsonschema>=4.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "reference"]
pythonpath = ["src", "reference"]
addopts = "-q --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["reference", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "E741"]
